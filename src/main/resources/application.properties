# Server
server.port=${PORT:8080}
  
  # DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
  
  # JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
  
  # App config
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Idle detection
app.idle.radius-meters=${APP_IDLE_RADIUS_METERS:100}
app.idle.idle-threshold-minutes=${APP_IDLE_IDLE_THRESHOLD_MINUTES:60}
app.idle.check-interval-ms=${APP_IDLE_CHECK_INTERVAL_MS:300000}

app.threshold.daily-drive-minutes=${APP_THRESHOLD_DAILY_DRIVE_MINUTES:480}

  
# Logging
logging.level.com.fleet.tracking=${LOGGING_LEVEL_COM_FLEET_TRACKING:INFO}

# Location ping cleanup
app.location-ping.retention-days=${APP_LOCATION_PING_RETENTION_DAYS:30}
app.location-ping.cleanup-cron=${APP_LOCATION_PING_CLEANUP_CRON:0 30 1 * * *}

# Alert cleanup
app.alert.retention-days=${APP_ALERT_RETENTION_DAYS:90}
app.alert.cleanup-cron=${APP_ALERT_CLEANUP_CRON:0 0 2 * * *}